<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕵️ بازی جاسوس</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a1a;
  --card: #12122a;
  --card-border: #1e1e3a;
  --accent: #00ff88;
  --accent2: #ff3366;
  --accent3: #7c3aed;
  --text: #e0e0f0;
  --text-muted: #6b6b8d;
  --glow-green: 0 0 20px rgba(0,255,136,0.3);
  --glow-red: 0 0 20px rgba(255,51,102,0.3);
  --glow-purple: 0 0 20px rgba(124,58,237,0.3);
}

body {
  font-family: 'Vazirmatn', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

.bg-grid {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: 
    linear-gradient(rgba(30,30,60,0.3) 1px, transparent 1px),
    linear-gradient(90deg, rgba(30,30,60,0.3) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.bg-glow {
  position: fixed;
  width: 300px; height: 300px;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.15;
  pointer-events: none;
  z-index: 0;
}
.bg-glow.g1 { top: -100px; right: -100px; background: var(--accent); }
.bg-glow.g2 { bottom: -100px; left: -100px; background: var(--accent2); }

.container {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.screen { display: none; flex-direction: column; align-items: center; gap: 20px; flex: 1; }
.screen.active { display: flex; }

/* ─── Landing ─── */
.logo {
  font-size: 72px;
  margin-top: 60px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.title {
  font-size: 36px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--accent3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-align: center;
}

.subtitle {
  color: var(--text-muted);
  font-size: 14px;
  text-align: center;
}

.btn {
  width: 100%;
  max-width: 320px;
  padding: 16px;
  border: none;
  border-radius: 16px;
  font-family: 'Vazirmatn', sans-serif;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), #00cc6a);
  color: #000;
  box-shadow: var(--glow-green);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,255,136,0.5); }

.btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--card-border);
}
.btn-secondary:hover { border-color: var(--accent3); }

.btn-danger {
  background: linear-gradient(135deg, var(--accent2), #cc2255);
  color: #fff;
  box-shadow: var(--glow-red);
}

.btn-small {
  padding: 10px 20px;
  font-size: 14px;
  width: auto;
}

/* ─── Players Screen ─── */
.card {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 24px;
}

.card-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--accent);
}

.input-row {
  display: flex;
  gap: 10px;
}

input[type="text"] {
  flex: 1;
  padding: 14px 18px;
  background: var(--bg);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Vazirmatn', sans-serif;
  font-size: 16px;
  outline: none;
  transition: border-color 0.3s;
}
input[type="text"]:focus { border-color: var(--accent); }
input[type="text"]::placeholder { color: var(--text-muted); }

.player-list {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.player-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--bg);
  border-radius: 12px;
  border: 1px solid var(--card-border);
  animation: slideIn 0.3s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

.player-name {
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
}

.player-num {
  width: 28px; height: 28px;
  background: var(--accent3);
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
}

.remove-btn {
  background: none;
  border: none;
  color: var(--accent2);
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
}

.player-count {
  font-size: 14px;
  color: var(--text-muted);
  text-align: center;
}
.player-count span { color: var(--accent); font-weight: 700; }

/* ─── Role Reveal ─── */
.role-card {
  width: 100%;
  max-width: 360px;
  aspect-ratio: 3/4;
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  cursor: pointer;
  transition: all 0.5s ease;
  position: relative;
  overflow: hidden;
}

.role-card.hidden {
  background: linear-gradient(135deg, var(--accent3), #5b21b6);
  box-shadow: var(--glow-purple);
}
.role-card.hidden::after {
  content: '🔍 برای نمایش نقش کلیک کن';
  font-size: 16px;
  color: rgba(255,255,255,0.8);
}

.role-card.revealed.spy {
  background: linear-gradient(135deg, #1a0011, #330022);
  border: 2px solid var(--accent2);
  box-shadow: var(--glow-red);
}
.role-card.revealed.normal {
  background: linear-gradient(135deg, #001a0d, #003319);
  border: 2px solid var(--accent);
  box-shadow: var(--glow-green);
}

.role-icon { font-size: 80px; }
.role-label { font-size: 28px; font-weight: 900; }
.role-location { font-size: 20px; color: var(--accent); font-weight: 500; }
.role-hint { font-size: 13px; color: var(--text-muted); }

.turn-info {
  text-align: center;
  font-size: 14px;
  color: var(--text-muted);
}
.turn-info strong { color: var(--accent); }

.btn-row {
  display: flex;
  gap: 10px;
  width: 100%;
  max-width: 360px;
}
.btn-row .btn { flex: 1; }

/* ─── Vote Screen ─── */
.vote-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
}

.vote-btn {
  padding: 16px;
  border-radius: 16px;
  border: 2px solid var(--card-border);
  background: var(--card);
  color: var(--text);
  font-family: 'Vazirmatn', sans-serif;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.vote-btn:hover { border-color: var(--accent2); transform: translateY(-2px); }
.vote-btn.selected { border-color: var(--accent2); background: rgba(255,51,102,0.15); box-shadow: var(--glow-red); }

.vote-count {
  font-size: 22px;
  font-weight: 900;
  color: var(--accent2);
}

/* ─── Result Screen ─── */
.result-card {
  width: 100%;
  padding: 32px;
  border-radius: 24px;
  text-align: center;
  animation: popIn 0.5s ease;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}
.result-card.win {
  background: linear-gradient(135deg, #001a0d, #003319);
  border: 2px solid var(--accent);
}
.result-card.lose {
  background: linear-gradient(135deg, #1a0011, #330022);
  border: 2px solid var(--accent2);
}

.result-icon { font-size: 80px; margin-bottom: 16px; }
.result-title { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
.result-subtitle { font-size: 16px; color: var(--text-muted); margin-bottom: 20px; }

.spy-reveal {
  padding: 16px;
  background: rgba(0,0,0,0.3);
  border-radius: 12px;
  margin-top: 16px;
}
.spy-reveal .label { font-size: 14px; color: var(--text-muted); }
.spy-reveal .value { font-size: 22px; font-weight: 700; color: var(--accent2); }

/* ─── Confetti ─── */
.confetti-container {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 100;
}
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  animation: confettiFall 3s ease-out forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ─── Timer ─── */
.timer {
  font-size: 36px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  text-shadow: var(--glow-green);
}

/* ─── Location Info ─── */
.location-info {
  width: 100%;
  padding: 16px;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  text-align: center;
}
.location-info .loc-label { font-size: 12px; color: var(--text-muted); }
.location-info .loc-name { font-size: 18px; font-weight: 700; color: var(--accent); margin-top: 4px; }

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 3px; }

/* ─── Responsive ─── */
@media (max-width: 360px) {
  .title { font-size: 28px; }
  .logo { font-size: 56px; }
  .btn { font-size: 16px; padding: 14px; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow g1"></div>
<div class="bg-glow g2"></div>

<div class="container">

  <!-- ═══════ Screen 1: Landing ═══════ -->
  <div class="screen active" id="screen-landing">
    <div class="logo">🕵️</div>
    <div class="title">بازی جاسوس</div>
    <div class="subtitle">جاسوس رو پیدا کن!</div>
    <button class="btn btn-primary" onclick="showScreen('screen-players')">🎮 شروع بازی</button>
  </div>

  <!-- ═══════ Screen 2: Players ═══════ -->
  <div class="screen" id="screen-players">
    <div class="card">
      <div class="card-title">👥 بازیکنان</div>
      <div class="input-row">
        <input type="text" id="playerInput" placeholder="نام بازیکن رو بنویس..." onkeypress="if(event.key==='Enter')addPlayer()">
        <button class="btn btn-primary btn-small" onclick="addPlayer()">افزودن</button>
      </div>
    </div>
    <div class="player-list" id="playerList"></div>
    <div class="player-count">تعداد بازیکنان: <span id="playerCount">0</span></div>
    <button class="btn btn-primary" onclick="startGame()" id="startBtn" style="opacity:0.5;pointer-events:none;">🎯 شروع بازی</button>
  </div>

  <!-- ═══════ Screen 3: Role ═══════ -->
  <div class="screen" id="screen-role">
    <div class="turn-info">
      <div>نوبت: <strong id="currentPlayerName"></strong></div>
      <div style="margin-top:4px;">روی کارت کلیک کن تا نقشت رو ببینی</div>
    </div>
    <div class="role-card hidden" id="roleCard" onclick="revealRole()"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="prevPlayer()">◀ قبلی</button>
      <button class="btn btn-primary" onclick="nextPlayer()" id="nextBtn">بعدی ▶</button>
    </div>
  </div>

  <!-- ═══════ Screen 4: Discussion ═══════ -->
  <div class="screen" id="screen-discussion">
    <div class="location-info" id="locationInfo">
      <div class="loc-label">📍 مکان بازی</div>
      <div class="loc-name" id="locationName"></div>
    </div>
    <div class="timer" id="timer">05:00</div>
    <div class="subtitle">زمان بحث و گفتگو</div>
    <div class="subtitle" style="font-size:12px;color:var(--accent2);">⚠️ جاسوس مکان رو نمیدونه!</div>
    <button class="btn btn-primary" onclick="startDiscussion()" id="discBtn">⏱ شروع تایمر</button>
    <button class="btn btn-danger" onclick="showScreen('screen-vote')">🗳 رأی‌گیری</button>
  </div>

  <!-- ═══════ Screen 5: Vote ═══════ -->
  <div class="screen" id="screen-vote">
    <div class="card">
      <div class="card-title">🗳 چه کسی جاسوسه؟</div>
      <div class="subtitle">روی بازیکن مورد نظرت کلیک کن تا رأی بدی</div>
    </div>
    <div class="vote-grid" id="voteGrid"></div>
    <button class="btn btn-danger" onclick="showResult()" id="voteSubmitBtn" style="opacity:0.5;pointer-events:none;">🔍 نتیجه</button>
  </div>

  <!-- ═══════ Screen 6: Result ═══════ -->
  <div class="screen" id="screen-result">
    <div class="result-card" id="resultCard"></div>
    <button class="btn btn-primary" onclick="resetGame()" style="margin-top:20px;">🔄 بازی جدید</button>
  </div>

</div>

<div class="confetti-container" id="confetti"></div>

<script>
// ═══════ Data ═══════
const LOCATIONS = [
  'بیمارستان', 'مدرسه', 'رستوران', 'هتل', 'فرودگاه',
  'پارک', 'سینما', 'کتابخانه', 'استخر', 'زندان',
  'فروشگاه', 'کارخانه', 'کلیسا', 'بانک', 'آتش‌نشانی',
  'پادگان', 'آشپزخانه', 'اتاق خواب', 'حیاط خلوت', 'گاراژ',
  'پمپ بنزین', 'آرایشگاه', 'داروخانه', 'کفش‌فروشی', 'نانوایی',
  'قهوه‌خانه', 'باغ وحش', 'موزه', 'پیتزا فروشی', 'ورزشگاه'
];

let players = [];
let roles = {};
let currentPlayerIdx = 0;
let spyIdx = -1;
let currentLocation = '';
let votes = {};
let timerInterval = null;
let timeLeft = 300;

// ═══════ Screens ═══════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ═══════ Players ═══════
function addPlayer() {
  const input = document.getElementById('playerInput');
  const name = input.value.trim();
  if (!name) return;
  if (players.includes(name)) return;
  players.push(name);
  input.value = '';
  renderPlayers();
}

function removePlayer(name) {
  players = players.filter(p => p !== name);
  renderPlayers();
}

function renderPlayers() {
  const list = document.getElementById('playerList');
  list.innerHTML = players.map((p, i) => `
    <div class="player-item">
      <div class="player-name">
        <div class="player-num">${i + 1}</div>
        ${p}
      </div>
      <button class="remove-btn" onclick="removePlayer('${p}')">✕</button>
    </div>
  `).join('');
  document.getElementById('playerCount').textContent = players.length;
  
  const btn = document.getElementById('startBtn');
  if (players.length >= 3) {
    btn.style.opacity = '1';
    btn.style.pointerEvents = 'auto';
  } else {
    btn.style.opacity = '0.5';
    btn.style.pointerEvents = 'none';
  }
}

// ═══════ Game Start ═══════
function startGame() {
  if (players.length < 3) return;
  
  // Pick random spy
  spyIdx = Math.floor(Math.random() * players.length);
  
  // Pick random location
  currentLocation = LOCATIONS[Math.floor(Math.random() * LOCATIONS.length)];
  
  // Assign roles
  roles = {};
  players.forEach((p, i) => {
    roles[p] = i === spyIdx ? 'spy' : 'normal';
  });
  
  // Shuffle player order for turns
  players = shuffle([...players]);
  currentPlayerIdx = 0;
  
  // Reset votes
  votes = {};
  
  showRoleScreen();
}

function showRoleScreen() {
  showScreen('screen-role');
  const card = document.getElementById('roleCard');
  card.className = 'role-card hidden';
  card.innerHTML = '';
  document.getElementById('currentPlayerName').textContent = players[currentPlayerIdx];
  
  const nextBtn = document.getElementById('nextBtn');
  if (currentPlayerIdx === players.length - 1) {
    nextBtn.textContent = '🎯 شروع بحث';
    nextBtn.onclick = function() { showScreen('screen-discussion'); };
  } else {
    nextBtn.textContent = 'بعدی ▶';
    nextBtn.onclick = nextPlayer;
  }
}

function revealRole() {
  const card = document.getElementById('roleCard');
  const player = players[currentPlayerIdx];
  const isSpy = roles[player] === 'spy';
  
  card.className = `role-card revealed ${isSpy ? 'spy' : 'normal'}`;
  card.innerHTML = isSpy ?
    `<div class="role-icon">🕵️</div>
     <div class="role-label" style="color:var(--accent2)">تو جاسوسی!</div>
     <div class="role-hint">مکان رو حدس بزن</div>` :
    `<div class="role-icon">👤</div>
     <div class="role-label" style="color:var(--accent)">تو شهروندی</div>
     <div class="role-location">${currentLocation}</div>
     <div class="role-hint">جاسوس رو پیدا کن</div>`;
}

function nextPlayer() {
  const card = document.getElementById('roleCard');
  if (card.classList.contains('hidden')) {
    revealRole();
    return;
  }
  currentPlayerIdx++;
  if (currentPlayerIdx < players.length) {
    showRoleScreen();
  }
}

function prevPlayer() {
  if (currentPlayerIdx > 0) {
    currentPlayerIdx--;
    showRoleScreen();
  }
}

// ═══════ Timer ═══════
function startDiscussion() {
  document.getElementById('locationName').textContent = currentLocation;
  document.getElementById('discBtn').style.display = 'none';
  
  timeLeft = 300;
  updateTimerDisplay();
  
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      showScreen('screen-vote');
    }
  }, 1000);
}

function updateTimerDisplay() {
  const min = Math.floor(timeLeft / 60).toString().padStart(2, '0');
  const sec = (timeLeft % 60).toString().padStart(2, '0');
  const el = document.getElementById('timer');
  el.textContent = `${min}:${sec}`;
  if (timeLeft <= 60) el.style.color = 'var(--accent2)';
}

// ═══════ Vote ═══════
function showScreen(id) {
  if (id === 'screen-vote' && !document.getElementById('screen-discussion').classList.contains('active')) {
    // came directly, skip discussion
  }
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  
  if (id === 'screen-vote') {
    renderVoteGrid();
  }
  
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderVoteGrid() {
  votes = {};
  const grid = document.getElementById('voteGrid');
  grid.innerHTML = players.map(p => `
    <button class="vote-btn" onclick="toggleVote('${p}', this)">
      <div>${p}</div>
      <div class="vote-count" id="vote-count-${p}">0</div>
    </button>
  `).join('');
}

function toggleVote(name, btn) {
  votes[name] = (votes[name] || 0) + 1;
  document.getElementById(`vote-count-${name}`).textContent = votes[name];
  
  // visual feedback
  btn.classList.add('selected');
  setTimeout(() => btn.classList.remove('selected'), 200);
  
  // enable submit
  const totalVotes = Object.values(votes).reduce((a, b) => a + b, 0);
  if (totalVotes >= players.length - 1) {
    const submitBtn = document.getElementById('voteSubmitBtn');
    submitBtn.style.opacity = '1';
    submitBtn.style.pointerEvents = 'auto';
  }
}

// ═══════ Result ═══════
function showResult() {
  if (timerInterval) clearInterval(timerInterval);
  
  // Find who got most votes
  let maxVotes = 0;
  let suspectedPlayer = '';
  for (const [name, count] of Object.entries(votes)) {
    if (count > maxVotes) {
      maxVotes = count;
      suspectedPlayer = name;
    }
  }
  
  const spyName = players.find(p => roles[p] === 'spy');
  const spyCaught = suspectedPlayer === spyName;
  
  const card = document.getElementById('resultCard');
  if (spyCaught) {
    card.className = 'result-card win';
    card.innerHTML = `
      <div class="result-icon">🎉</div>
      <div class="result-title" style="color:var(--accent)">جاسوس پیدا شد!</div>
      <div class="result-subtitle">شهروندان پیروز شدند</div>
      <div class="spy-reveal">
        <div class="label">🕵️ جاسوس واقعی</div>
        <div class="value">${spyName}</div>
      </div>
      <div class="spy-reveal" style="margin-top:10px">
        <div class="label">📍 مکان بازی</div>
        <div class="value" style="color:var(--accent)">${currentLocation}</div>
      </div>`;
    showConfetti();
  } else {
    card.className = 'result-card lose';
    card.innerHTML = `
      <div class="result-icon">🕵️</div>
      <div class="result-title" style="color:var(--accent2)">جاسوس فرار کرد!</div>
      <div class="result-subtitle">${suspectedPlayer ? `بازیکنان ${suspectedPlayer} رو متهم کردند` : 'کسی رأی نداد'}</div>
      <div class="spy-reveal">
        <div class="label">🕵️ جاسوس واقعی</div>
        <div class="value">${spyName}</div>
      </div>
      <div class="spy-reveal" style="margin-top:10px">
        <div class="label">📍 مکان بازی</div>
        <div class="value" style="color:var(--accent)">${currentLocation}</div>
      </div>`;
  }
  
  showScreen('screen-result');
}

// ═══════ Reset ═══════
function resetGame() {
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById('discBtn').style.display = '';
  document.getElementById('timer').style.color = 'var(--accent)';
  document.getElementById('timer').textContent = '05:00';
  document.getElementById('voteSubmitBtn').style.opacity = '0.5';
  document.getElementById('voteSubmitBtn').style.pointerEvents = 'none';
  showScreen('screen-players');
}

// ═══════ Helpers ═══════
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function showConfetti() {
  const container = document.getElementById('confetti');
  const colors = ['#00ff88', '#ff3366', '#7c3aed', '#ffcc00', '#00ccff'];
  for (let i = 0; i < 50; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + '%';
    el.style.top = '-10px';
    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDelay = Math.random() * 2 + 's';
    el.style.animationDuration = (2 + Math.random() * 2) + 's';
    container.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}
</script>
