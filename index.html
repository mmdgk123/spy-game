<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SpyGK — بازی جاسوس</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕵️</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#06060f;
  --bg2:#0c0c1d;
  --card:#111128;
  --card2:#161636;
  --border:#1c1c40;
  --accent:#00ff88;
  --accent-dim:#00cc6a;
  --red:#ff2255;
  --purple:#8b5cf6;
  --purple-dim:#6d28d9;
  --gold:#fbbf24;
  --blue:#3b82f6;
  --text:#eeeef8;
  --muted:#5a5a80;
  --glass:rgba(17,17,40,0.85);
  --r:16px;
}

html,body{height:100%;overflow:hidden}

body{
  font-family:'Vazirmatn',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
}

/* ═══ Background Effects ═══ */
.bg-anim{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.12;animation:orbFloat 20s ease-in-out infinite alternate}
.orb.o1{width:400px;height:400px;background:var(--accent);top:-100px;right:-100px}
.orb.o2{width:300px;height:300px;background:var(--red);bottom:-80px;left:-80px;animation-delay:-10s}
.orb.o3{width:250px;height:250px;background:var(--purple);top:40%;left:50%;animation-delay:-5s}
@keyframes orbFloat{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.1)}100%{transform:translate(-20px,30px) scale(.9)}}

.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(28,28,64,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(28,28,64,.25) 1px,transparent 1px);
  background-size:48px 48px}

/* ═══ Main Container ═══ */
.app{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

.screen{display:none;flex-direction:column;align-items:center;padding:20px;min-height:100%;animation:fadeUp .4s ease}
.screen.active{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ═══ Landing ═══ */
.landing{justify-content:center;gap:16px;padding-top:60px}
.logo-wrap{position:relative;margin-bottom:8px}
.logo-emoji{font-size:80px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 20px rgba(0,255,136,.3))}50%{transform:scale(1.05);filter:drop-shadow(0 0 40px rgba(0,255,136,.5))}}
.brand{font-size:42px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--purple),var(--accent));background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradShift 4s ease infinite;letter-spacing:-1px}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.tagline{color:var(--muted);font-size:13px;letter-spacing:2px;text-transform:uppercase}
.feature-row{display:flex;gap:12px;margin-top:24px}
.feat{padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.feat span{font-size:16px}

/* ═══ Buttons ═══ */
.btn{width:100%;max-width:360px;padding:16px;border:none;border-radius:var(--r);font-family:'Vazirmatn',sans-serif;font-size:17px;font-weight:700;cursor:pointer;transition:all .25s ease;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn-glow{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#000;box-shadow:0 4px 24px rgba(0,255,136,.3)}
.btn-glow:hover{box-shadow:0 4px 32px rgba(0,255,136,.5)}
.btn-red{background:linear-gradient(135deg,var(--red),#cc1144);color:#fff;box-shadow:0 4px 24px rgba(255,34,85,.3)}
.btn-purple{background:linear-gradient(135deg,var(--purple),var(--purple-dim));color:#fff;box-shadow:0 4px 24px rgba(139,92,246,.3)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent)}
.btn-sm{padding:10px 20px;font-size:14px;width:auto}
.btn-disabled{opacity:.35;pointer-events:none}

/* ═══ Cards ═══ */
.card{width:100%;max-width:400px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card-glow{border-color:rgba(0,255,136,.2);box-shadow:0 0 30px rgba(0,255,136,.05)}
.section-title{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title .icon{font-size:22px}

/* ═══ Input ═══ */
.input-group{display:flex;gap:8px}
.inp{flex:1;padding:13px 16px;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--muted)}

/* ═══ Players ═══ */
.players-list{width:100%;max-width:400px;display:flex;flex-direction:column;gap:6px}
.p-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;animation:slideR .3s ease}
@keyframes slideR{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.p-left{display:flex;align-items:center;gap:10px}
.p-num{width:30px;height:30px;background:var(--purple);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.p-name{font-weight:500;font-size:15px}
.p-del{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:4px 8px;opacity:.6;transition:opacity .2s}
.p-del:hover{opacity:1}
.counter{text-align:center;color:var(--muted);font-size:13px}
.counter b{color:var(--accent)}

/* ═══ Role Card ═══ */
.role-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:360px}
.role-turn{font-size:13px;color:var(--muted);text-align:center}
.role-turn b{color:var(--accent)}

.role-card{width:100%;aspect-ratio:3/4;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;transition:all .5s ease;position:relative;overflow:hidden}
.role-card::before{content:'';position:absolute;inset:0;border-radius:20px;opacity:0;transition:opacity .5s}
.role-card.face-down{background:linear-gradient(135deg,var(--purple-dim),#3b0764);border:2px solid var(--purple);box-shadow:0 0 40px rgba(139,92,246,.25)}
.role-card.face-down::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(255,255,255,.03) 10px,rgba(255,255,255,.03) 20px)}
.role-card.face-down .tap-hint{font-size:14px;color:rgba(255,255,255,.7)}
.role-card.face-down .role-big-icon{font-size:72px;opacity:.7}

.role-card.spy-card{background:linear-gradient(160deg,#1a0011,#330022,#1a0011);border:2px solid var(--red);box-shadow:0 0 50px rgba(255,34,85,.2)}
.role-card.citizen-card{background:linear-gradient(160deg,#00120a,#00331a,#00120a);border:2px solid var(--accent);box-shadow:0 0 50px rgba(0,255,136,.2)}

.role-big-icon{font-size:72px}
.role-title{font-size:28px;font-weight:900}
.role-loc{font-size:18px;font-weight:600;padding:8px 20px;background:rgba(0,255,136,.1);border-radius:10px;border:1px solid rgba(0,255,136,.2)}
.role-hint-text{font-size:12px;color:var(--muted);max-width:280px;text-align:center;line-height:1.8}

.nav-row{display:flex;gap:8px;width:100%;max-width:360px}
.nav-row .btn{flex:1}

/* ═══ Category Select ═══ */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.cat-btn{padding:14px 12px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;cursor:pointer;transition:all .2s;text-align:center;font-family:'Vazirmatn',sans-serif}
.cat-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.cat-btn.selected{border-color:var(--accent);background:rgba(0,255,136,.08);box-shadow:0 0 20px rgba(0,255,136,.1)}
.cat-icon{font-size:28px;margin-bottom:4px}
.cat-name{font-size:13px;font-weight:600;color:var(--text)}
.cat-count{font-size:11px;color:var(--muted)}

/* ═══ Discussion ═══ */
.disc-top{text-align:center;margin-bottom:8px}
.disc-loc{font-size:14px;color:var(--muted);margin-bottom:4px}
.disc-loc b{color:var(--accent);font-size:18px}
.timer-ring{position:relative;width:160px;height:160px;margin:16px auto}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:6}
.timer-ring .bg-ring{stroke:var(--border)}
.timer-ring .fg-ring{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer-ring .fg-ring.warn{stroke:var(--red)}
.timer-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-num{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent)}
.timer-num.warn{color:var(--red)}
.timer-label{font-size:11px;color:var(--muted)}
.disc-warn{font-size:12px;color:var(--red);background:rgba(255,34,85,.08);padding:8px 16px;border-radius:10px;border:1px solid rgba(255,34,85,.15);text-align:center}

/* ═══ Vote ═══ */
.vote-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.vote-btn{padding:16px 10px;background:var(--card);border:2px solid var(--border);border-radius:14px;cursor:pointer;transition:all .2s;text-align:center;font-family:'Vazirmatn',sans-serif;color:var(--text)}
.vote-btn:hover{border-color:var(--red)}
.vote-btn.pressed{border-color:var(--red);background:rgba(255,34,85,.1);box-shadow:0 0 20px rgba(255,34,85,.15)}
.v-name{font-size:15px;font-weight:600;margin-bottom:4px}
.v-count{font-size:26px;font-weight:900;color:var(--red)}

/* ═══ Result ═══ */
.result-box{width:100%;max-width:380px;padding:28px 20px;border-radius:24px;text-align:center;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.result-box.win{background:linear-gradient(160deg,#00120a,#00331a);border:2px solid var(--accent);box-shadow:0 0 60px rgba(0,255,136,.15)}
.result-box.lose{background:linear-gradient(160deg,#1a0011,#330022);border:2px solid var(--red);box-shadow:0 0 60px rgba(255,34,85,.15)}
.r-icon{font-size:80px;margin-bottom:12px}
.r-title{font-size:26px;font-weight:900;margin-bottom:6px}
.r-sub{font-size:14px;color:var(--muted);margin-bottom:20px}
.r-info{padding:14px;background:rgba(0,0,0,.3);border-radius:12px;margin-top:10px}
.r-info .lbl{font-size:11px;color:var(--muted)}
.r-info .val{font-size:20px;font-weight:700;margin-top:2px}

/* ═══ Confetti ═══ */
.confetti-box{position:fixed;inset:0;pointer-events:none;z-index:99}
.conf{position:absolute;width:8px;height:8px;border-radius:2px;animation:confFall 3s ease-out forwards}
@keyframes confFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ═══ Scrollbar ═══ */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ═══ Responsive ═══ */
@media(max-width:360px){.brand{font-size:34px}.logo-emoji{font-size:64px}}
</style>
</head>
<body>

<div class="bg-anim"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="grid-bg"></div>

<div class="app">

<!-- ══════ LANDING ══════ -->
<div class="screen active landing" id="s-landing">
  <div class="logo-wrap"><div class="logo-emoji">🕵️</div></div>
  <div class="brand">SpyGK</div>
  <div class="tagline">جاسوس رو پیدا کن</div>
  <div class="feature-row">
    <div class="feat"><span>👥</span>۳-۱۲ نفره</div>
    <div class="feat"><span>🎯</span>۵۰+ مکان</div>
    <div class="feat"><span>💡</span>هینت جاسوس</div>
  </div>
  <button class="btn btn-glow" onclick="go('s-category')" style="margin-top:32px">🎮 شروع بازی</button>
</div>

<!-- ══════ CATEGORY ══════ -->
<div class="screen" id="s-category">
  <div class="card card-glow">
    <div class="section-title"><span class="icon">📂</span>دسته‌بندی مکان رو انتخاب کن</div>
    <div class="cat-grid" id="catGrid"></div>
  </div>
  <button class="btn btn-ghost" onclick="go('s-landing')" style="margin-top:12px">بازگشت</button>
</div>

<!-- ══════ PLAYERS ══════ -->
<div class="screen" id="s-players">
  <div class="card card-glow">
    <div class="section-title"><span class="icon">👥</span>بازیکنان</div>
    <div class="input-group">
      <input class="inp" id="pInput" placeholder="نام بازیکن..." onkeydown="if(event.key==='Enter')addP()">
      <button class="btn btn-glow btn-sm" onclick="addP()">افزودن</button>
    </div>
  </div>
  <div class="players-list" id="pList"></div>
  <div class="counter">تعداد: <b id="pCount">0</b> بازیکن</div>
  <button class="btn btn-glow" id="startBtn" onclick="beginGame()" class="btn-disabled">🎯 شروع بازی</button>
</div>

<!-- ══════ ROLE ══════ -->
<div class="screen" id="s-role">
  <div class="role-wrap">
    <div class="role-turn">نوبت: <b id="rpName"></b> <span id="rpIdx" style="color:var(--muted);font-size:12px"></span></div>
    <div class="role-card face-down" id="roleCard" onclick="flipCard()">
      <div class="role-big-icon">🕵️</div>
      <div class="tap-hint">🔍 برای نمایش نقش کلیک کن</div>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="prevP()">◀ قبلی</button>
      <button class="btn btn-purple" id="roleNextBtn" onclick="nextP()">بعدی ▶</button>
    </div>
  </div>
</div>

<!-- ══════ DISCUSSION ══════ -->
<div class="screen" id="s-disc">
  <div class="disc-top">
    <div class="disc-loc">مکان: <b id="discLoc"></b></div>
  </div>
  <div class="timer-ring" id="timerRing">
    <svg viewBox="0 0 172 172"><circle class="bg-ring" cx="86" cy="86" r="78"/><circle class="fg-ring" id="fgRing" cx="86" cy="86" r="78" stroke-dasharray="490" stroke-dashoffset="0"/></svg>
    <div class="timer-text"><div class="timer-num" id="timerNum">05:00</div><div class="timer-label">زمان باقی‌مانده</div></div>
  </div>
  <div class="disc-warn">⚠️ جاسوس مکان رو نمیدونه — مراقب جواب‌هاش باش!</div>
  <button class="btn btn-glow" id="discStart" onclick="startTimer()" style="margin-top:16px">⏱ شروع تایمر</button>
  <button class="btn btn-red" onclick="go('s-vote')" style="margin-top:8px">🗳 رأی‌گیری</button>
</div>

<!-- ══════ VOTE ══════ -->
<div class="screen" id="s-vote">
  <div class="card card-glow">
    <div class="section-title"><span class="icon">🗳</span>جاسوس کیه؟</div>
    <div style="font-size:13px;color:var(--muted)">روی بازیکن کلیک کن — هر نفر یه رأی</div>
  </div>
  <div class="vote-grid" id="vGrid"></div>
  <button class="btn btn-red" id="voteBtn" onclick="showRes()" class="btn-disabled">🔍 نتیجه نهایی</button>
</div>

<!-- ══════ RESULT ══════ -->
<div class="screen" id="s-result">
  <div class="result-box" id="resBox"></div>
  <button class="btn btn-glow" onclick="reset()" style="margin-top:24px">🔄 بازی جدید</button>
</div>

</div>

<div class="confetti-box" id="confetti"></div>

<script>

      {name:'آموزشگاه موسیقی',hint:'گیتار و نت'},
      {name:'آزمون آیین‌نامه',hint:'سوال و گواهینامه'},
      {name:'کلاس نقاشی',hint:'قلممو و رنگ'},
    ]
  },
  '✈️ سفر': {
    locations: [
      {name:'چادر مسافرتی',hint:'طبیعت و شب'},
      {name:'کشتی',hint:'دریا و موج'},
      {name:'قایق',hint:'پارو و آب'},
      {name:'جت‌اسکی',hint:'سرعت و آبی'},
      {name:'چتر نجات',hint:'پرش از هواپیما'},
      {name:'کوهنوردی',hint:'قله و کوله‌پشتی'},
    ]
  },
};

let players=[], roles={}, spyIdx=-1, currentLoc=null, currentCat=null;
let pIdx=0, votes={}, timer=null, timeLeft=300, usedLocations=new Set();

// ═══════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='s-category') renderCats();
}

// ═══════════════════════════════════════
//  CATEGORIES
// ═══════════════════════════════════════
function renderCats(){
  const g=document.getElementById('catGrid');
  g.innerHTML=Object.keys(CATEGORIES).map(k=>{
    const cat=CATEGORIES[k];
    const [icon,...name]=k.split(' ');
    return `<div class="cat-btn ${currentCat===k?'selected':''}" onclick="selectCat('${k}')">
      <div class="cat-icon">${icon}</div>
      <div class="cat-name">${name.join(' ')}</div>
      <div class="cat-count">${cat.locations.length} مکان</div>
    </div>`;
  }).join('');
}

function selectCat(k){
  currentCat=k;
  go('s-players');
}

// ═══════════════════════════════════════
//  PLAYERS
// ═══════════════════════════════════════
function addP(){
  const inp=document.getElementById('pInput');
  const n=inp.value.trim();
  if(!n||players.includes(n))return;
  players.push(n);inp.value='';renderP();
}
function removeP(n){players=players.filter(p=>p!==n);renderP()}
function renderP(){
  document.getElementById('pList').innerHTML=players.map((p,i)=>`
    <div class="p-item">
      <div class="p-left"><div class="p-num">${i+1}</div><div class="p-name">${p}</div></div>
      <button class="p-del" onclick="removeP('${p}')">✕</button>
    </div>`).join('');
  document.getElementById('pCount').textContent=players.length;
  const b=document.getElementById('startBtn');
  players.length>=3?b.classList.remove('btn-disabled'):b.classList.add('btn-disabled');
}

// ═══════════════════════════════════════
//  GAME LOGIC
// ═══════════════════════════════════════
function beginGame(){
  if(players.length<3||!currentCat)return;
  // pick location
  const locs=CATEGORIES[currentCat].locations.filter(l=>!usedLocations.has(l.name));
  if(locs.length===0){usedLocations.clear();return beginGame()}
  currentLoc=locs[Math.floor(Math.random()*locs.length)];
  usedLocations.add(currentLoc.name);
  // pick spy
  spyIdx=Math.floor(Math.random()*players.length);
  roles={};players.forEach((p,i)=>roles[p]=i===spyIdx?'spy':'citizen');
  players=shuffle([...players]);pIdx=0;votes={};
  go('s-role');showRole();
}

function showRole(){
  document.getElementById('rpName').textContent=players[pIdx];
  document.getElementById('rpIdx').textContent=`(${pIdx+1}/${players.length})`;
  const card=document.getElementById('roleCard');
  card.className='role-card face-down';
  card.innerHTML='<div class="role-big-icon">🕵️</div><div class="tap-hint">🔍 برای نمایش نقش کلیک کن</div>';
  const btn=document.getElementById('roleNextBtn');
  if(pIdx===players.length-1){btn.textContent='🎯 شروع بحث';btn.onclick=()=>go('s-disc')}
  else{btn.textContent='بعدی ▶';btn.onclick=nextP}
}

function flipCard(){
  const card=document.getElementById('roleCard');
  if(!card.classList.contains('face-down'))return;
  const p=players[pIdx],isSpy=roles[p]==='spy';
  card.className=`role-card ${isSpy?'spy-card':'citizen-card'}`;
  if(isSpy){
    const cat=CATEGORIES[currentCat];
    const otherLocs=cat.locations.filter(l=>l.name!==currentLoc.name);
    const fakeHint=otherLocs[Math.floor(Math.random()*otherLocs.length)].hint;
    card.innerHTML=`
      <div class="role-big-icon">🕵️</div>
      <div class="role-title" style="color:var(--red)">تو جاسوسی!</div>
      <div class="role-hint-text">مکان بازی رو نمیدونی — حدس بزن!<br>یه هینت تصادفی: <b style="color:var(--gold)">"${fakeHint}"</b></div>`;
  } else {
    card.innerHTML=`
      <div class="role-big-icon">👤</div>
      <div class="role-title" style="color:var(--accent)">تو شهروندی</div>
      <div class="role-loc">${currentLoc.name}</div>
      <div class="role-hint-text">هینت: <b style="color:var(--gold)">${currentLoc.hint}</b><br>جاسوس رو پیدا کن!</div>`;
  }
}

function nextP(){
  if(!document.getElementById('roleCard').classList.contains('face-down')){pIdx++;if(pIdx<players.length)showRole();return}
  flipCard();
}
function prevP(){if(pIdx>0){pIdx--;showRole()}}

// ═══════════════════════════════════════
//  TIMER
// ═══════════════════════════════════════
function startTimer(){
  document.getElementById('discLoc').textContent=currentLoc.name;
  document.getElementById('discStart').style.display='none';
  timeLeft=300;updateRing();
  timer=setInterval(()=>{timeLeft--;updateRing();if(timeLeft<=0){clearInterval(timer);go('s-vote')}},1000);
}

function updateRing(){
  const m=Math.floor(timeLeft/60).toString().padStart(2,'0');
  const s=(timeLeft%60).toString().padStart(2,'0');
  document.getElementById('timerNum').textContent=`${m}:${s}`;
  const circ=document.getElementById('fgRing');
  const offset=490*(1-timeLeft/300);
  circ.style.strokeDashoffset=offset;
  const num=document.getElementById('timerNum');
  if(timeLeft<=60){circ.classList.add('warn');num.classList.add('warn')}
  else{circ.classList.remove('warn');num.classList.remove('warn')}
}

// ═══════════════════════════════════════
//  VOTE
// ═══════════════════════════════════════
function go(id){
  if(timer&&id!=='s-disc'){clearInterval(timer);timer=null}
  if(id==='s-vote')renderVote();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='s-category')renderCats();
}

function renderVote(){
  votes={};
  document.getElementById('vGrid').innerHTML=players.map(p=>`
    <div class="vote-btn" onclick="castVote('${p}',this)">
      <div class="v-name">${p}</div>
      <div class="v-count" id="vc-${p}">0</div>
    </div>`).join('');
  document.getElementById('voteBtn').classList.add('btn-disabled');
}

function castVote(name,el){
  votes[name]=(votes[name]||0)+1;
  document.getElementById(`vc-${name}`).textContent=votes[name];
  el.classList.add('pressed');setTimeout(()=>el.classList.remove('pressed'),200);
  if(Object.values(votes).reduce((a,b)=>a+b,0)>=players.length-1)
    document.getElementById('voteBtn').classList.remove('btn-disabled');
}

// ═══════════════════════════════════════
//  RESULT
// ═══════════════════════════════════════
function showRes(){
  let max=0,sus='';
  for(const[n,c]of Object.entries(votes)){if(c>max){max=c;sus=n}}
  const spy=players.find(p=>roles[p]==='spy');
  const caught=sus===spy;
  const box=document.getElementById('resBox');
  if(caught){
    box.className='result-box win';
    box.innerHTML=`
      <div class="r-icon">🎉</div>
      <div class="r-title" style="color:var(--accent)">جاسوس پیدا شد!</div>
      <div class="r-sub">شهروندان پیروز شدند</div>
      <div class="r-info"><div class="lbl">🕵️ جاسوس واقعی</div><div class="val" style="color:var(--red)">${spy}</div></div>
      <div class="r-info"><div class="lbl">📍 مکان بازی</div><div class="val" style="color:var(--accent)">${currentLoc.name}</div></div>`;
    confetti();
  } else {
    box.className='result-box lose';
    box.innerHTML=`
      <div class="r-icon">🕵️</div>
      <div class="r-title" style="color:var(--red)">جاسوس فرار کرد!</div>
      <div class="r-sub">${sus?`بازیکنان ${sus} رو متهم کردند`:'هیچ رأی‌ای داده نشد'}</div>
      <div class="r-info"><div class="lbl">🕵️ جاسوس واقعی</div><div class="val" style="color:var(--red)">${spy}</div></div>
      <div class="r-info"><div class="lbl">📍 مکان بازی</div><div class="val" style="color:var(--accent)">${currentLoc.name}</div></div>`;
  }
  go('s-result');
}

function reset(){
  if(timer)clearInterval(timer);timer=null;
  document.getElementById('discStart').style.display='';
  document.getElementById('timerNum').classList.remove('warn');
  document.getElementById('fgRing').classList.remove('warn');
  document.getElementById('timerNum').textContent='05:00';
  document.getElementById('fgRing').style.strokeDashoffset='0';
  document.getElementById('voteBtn').classList.add('btn-disabled');
  go('s-category');
}

// ═══════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function confetti(){
  const c=document.getElementById('confetti');c.innerHTML='';
  const colors=['#00ff88','#ff2255','#8b5cf6','#fbbf24','#3b82f6','#fff'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div');el.className='conf';
    el.style.left=Math.random()*100+'%';el.style.top='-10px';
    el.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDelay=Math.random()*2+'s';
    el.style.animationDuration=(2+Math.random()*2)+'s';
    c.appendChild(el);setTimeout(()=>el.remove(),5000);
  }
}
</script>
</body>
</html>
